# One command: docker compose up --build   ->   http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doomsday
      POSTGRES_PASSWORD: doomsday
      POSTGRES_DB: doomsday
    ports:
      # Host port defaults to 5433 to avoid clashing with a locally installed Postgres.
      - '${DB_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doomsday -d doomsday']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://doomsday:doomsday@db:5432/doomsday
      CORS_ORIGIN: http://localhost:${APP_PORT:-8080}
      SEED_ON_START: 'true'
      # Optional: export TMDB_API_KEY (or put it in a root .env file) to enable posters.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
