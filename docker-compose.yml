services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doomsday
      POSTGRES_PASSWORD: doomsday
      POSTGRES_DB: doomsday
    ports:
      # Host port defaults to 5433 to avoid clashing with a locally installed Postgres.
      - '${DB_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doomsday -d doomsday']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
